name: Verify Freshdesk connector

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run tools:export
      - run: git diff --exit-code -- docs/mcp-tools.json
      - uses: actions/upload-artifact@v4
        with:
          name: fictional-demo-evidence
          path: artifacts/demo-report.json
